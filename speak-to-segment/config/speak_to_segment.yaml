server:
  host: 0.0.0.0
  port: 19333
  debug: true

asr:
  target_address: http://localhost:11216/predict
  timeout: 10
sam:
  target_address: http://localhost:11217/predict
  timeout: 10
  conf_threshold: 0.5

storage:
  audio_dir: ${hydra:runtime.cwd}/data/audio
  image_dir: ${hydra:runtime.cwd}/data/images
  mask_dir: ${hydra:runtime.cwd}/data/masks
  static_dir: ${hydra:runtime.cwd}/data/static
  max_history: 10
